name: Generate Resume (PDF & Markdown)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "public/cvs/*"
      - "public/docs/*"

permissions:
  contents: write

jobs:
  generate-resume:
    runs-on: ubuntu-latest
    # Forks cannot push back to the PR branch.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup pnpm and puppeteer cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            ~/.cache/puppeteer
          key: ${{ runner.os }}-pnpm-puppeteer-${{ hashFiles('pnpm-lock.yaml', '.github/scripts/generate-resume/package.json') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-puppeteer-

      - name: Install site dependencies
        run: pnpm install --frozen-lockfile

      - name: Install generator dependencies and browser
        working-directory: .github/scripts/generate-resume
        run: |
          pnpm install
          pnpm exec puppeteer browsers install chrome

      - name: Build and serve the site
        run: |
          pnpm build
          nohup pnpm start > /tmp/next-server.log 2>&1 &
          for i in {1..30}; do
            if curl -sf "http://localhost:3000/cv?lang=es" > /dev/null; then
              echo "✅ Site is up"
              exit 0
            fi
            echo "⏳ Attempt $i/30: waiting for localhost:3000..."
            sleep 2
          done
          echo "❌ Site did not start in time"
          cat /tmp/next-server.log
          exit 1

      - name: Generate resume files (PDF & Markdown)
        env:
          SITE_URL: http://localhost:3000
        run: node .github/scripts/generate-resume/index.js

      - name: Commit updated CV files
        run: |
          git add public/cvs/CV_Hector_Martin_ES.pdf public/cvs/CV_Hector_Martin_EN.pdf
          if git diff --cached --quiet; then
            echo "📄 No changes in CV files"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "🤖 Auto-update CV PDFs (ES & EN) [skip ci]"
          git push
